<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Microsoft Azure Fundamentals</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f7fa; color: #172033; }
    header { background: #0078d4; color: white; padding: 1rem 1.5rem; }
    header strong { font-size: 1.1rem; }
    main { max-width: 760px; margin: 4rem auto; padding: 0 1.5rem; }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); line-height: 1.08; margin: 0 0 1rem; }
    p { font-size: 1.2rem; line-height: 1.6; }
    .status { border-left: 5px solid #107c10; background: white; padding: 1rem 1.25rem; box-shadow: 0 8px 24px rgba(23,32,51,.08); }
    footer { margin-top: 3rem; color: #52606d; font-size: .95rem; }
  </style>
</head>
<body>
  <header><strong>MMAUG Bootcamp</strong></header>
  <main>
    <h1>Welcome to Microsoft Azure Fundamentals</h1>
    <p>MMAUG 30-Day AI and DevOps Fundamentals Bootcamp</p>
    <div class="status"><strong>Deployment successful.</strong> This page is running on Azure App Service.</div>
    <footer>Built during the Microsoft Azure Fundamentals hands-on lab.</footer>
  </main>
</body>
</html>
